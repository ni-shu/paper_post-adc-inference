[project]
name = "sicore"
version = "3.0.0+localfix"
requires-python = ">=3.8"
dependencies = [
  "joblib>=1.4.2",
  "matplotlib>=3.9.1",
  "numpy>=1.26.4,<2.0.0",
  "scipy>=1.14.0",
  "tqdm>=4.66.5",
  "typing-extensions>=4.12.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sicore"]
